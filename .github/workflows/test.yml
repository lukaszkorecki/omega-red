name: Test
on: push


concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        version:
          - "redis:latest"
          - "redis:7"
          - "valkey/valkey:8.0.2"
          - "valkey/valkey:latest"
          - "valkey/valkey:7.2"

    runs-on: ubuntu-latest
    container:
      image: clojure:temurin-25-lein-2.13.0
    services:
      redis:
        image: ${{ matrix.version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Cache deps
      uses: actions/cache@v6.1.0
      with:
        path: ~/.m2/repository
        key: v1-deps-${{ hashFiles('project.clj') }}
        restore-keys: |
          v1-deps-${{ hashFiles('project.clj') }}
          v1-deps-

    - name: Install dependencies
      run: lein deps

    - name: Prepare command config
      run: lein gen-cmd-config

    - name: Run omega-red tests for ${{ matrix.version }}
      id: tests
      run: lein ci-test 2>&1
      env:
        REDIS_HOST: redis
        REDIS_PORT: 6379
